<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA - Secretaría de Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* PALETA LIQUID GLASS */
        :root[data-theme="light"] {
            --bg-color: #f4f7fe;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4318ff;
            --success: #05cd99;
            --danger: #ee5d50;
            --warning: #ffb547;
            --border-light: rgba(255, 255, 255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            
            --chat-user-bg: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%);
            --chat-user-text: #ffffff;
            --chat-bot-bg: rgba(255, 255, 255, 0.9);
            --chat-bot-text: #1e293b;
            --chat-bot-border: rgba(67, 24, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* Burbujas flotantes de fondo optimizadas */
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(80px);
            z-index: -1; animation: float 15s infinite alternate ease-in-out;
            will-change: transform; transform: translateZ(0); pointer-events: none;
        }
        body::before { width: 45vw; height: 45vw; background: rgba(67, 24, 255, 0.15); top: -10%; left: -10%; }
        body::after { width: 35vw; height: 35vw; background: rgba(5, 205, 153, 0.15); bottom: -10%; right: -5%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(6vw, 6vh, 0) scale(1.1); }
        }

        /* --- PANTALLA DE SELECCIÓN DE TEMA --- */
        #selector_pantalla {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(244, 247, 254, 0.5);
        }

        .selector-card {
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--border-light);
            border-left: 1px solid var(--border-light);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .icon-robot {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(67, 24, 255, 0.3));
        }

        .form-select-custom {
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.05rem;
            color: var(--text-main);
            width: 100%;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            outline: none;
            transition: all 0.3s;
        }
        .form-select-custom:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.15); }

        .btn-start {
            background: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(67, 24, 255, 0.3);
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(67, 24, 255, 0.4); color: white; }

        /* --- INTERFAZ DEL CHAT --- */
        #chat_pantalla {
            display: none;
            flex-direction: column;
            height: 100vh;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }

        .chat-header {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .badge-tema {
            background: rgba(67, 24, 255, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(67, 24, 255, 0.2);
            display: flex;
            align-items: center;
        }

        .chat-history {
            flex-grow: 1;
            background: transparent;
            overflow-y: auto;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        /* Burbujas de Chat */
        .msg {
            max-width: 80%;
            padding: 18px 24px;
            border-radius: 24px;
            font-size: 1.05rem;
            line-height: 1.6;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            word-wrap: break-word;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-bot {
            align-self: flex-start;
            background: var(--chat-bot-bg);
            color: var(--chat-bot-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--chat-bot-border);
        }
        .msg-bot strong { color: var(--primary); }

        .msg-user {
            align-self: flex-end;
            background: var(--chat-user-bg);
            color: var(--chat-user-text);
            border-bottom-right-radius: 4px;
        }

        /* Área de input */
        .chat-input-area {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 15px;
            display: flex;
            gap: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            margin-top: 20px;
            flex-shrink: 0;
            align-items: center;
        }

        .chat-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 10px 15px;
            font-size: 1.05rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 45px;
            font-family: 'Inter', sans-serif;
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-send:hover { transform: scale(1.05); background: #3210cc; }
        .btn-send:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        /* Animación "Escribiendo..." */
        .typing { display: flex; gap: 5px; align-items: center; height: 24px;}
        .dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; opacity: 0.7;}
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
    </style>
</head>

<body>

    <div id="selector_pantalla">
        <a href="index.html" class="btn btn-light position-absolute top-0 start-0 m-4 rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; z-index: 100; border: 1px solid var(--border-color); background: var(--card-bg); backdrop-filter: blur(10px);" title="Volver al Portal">
            <i class="bi bi-house-door-fill fs-5" style="color: var(--text-main);"></i>
        </a>

        <div class="selector-card">
            <div class="icon-robot"><i class="bi bi-robot"></i></div>
            <h2 class="fw-bold mb-2">Evaluador Clínico IA</h2>
            <p class="text-muted mb-4">Ingresa el identificador (ID) del módulo normativo o curso que deseas evaluar.</p>

            <div class="mb-4">
                <input type="text" id="input_tema_id" class="form-select-custom py-3 text-center fw-bold" placeholder="Ej: primera_infancia" style="font-size: 1.1rem; margin-bottom: 0; letter-spacing: 1px;">
            </div>

            <button class="btn-start" id="btn_iniciar" onclick="iniciarEvaluacion()">
                <i class="bi bi-play-fill me-1"></i> Iniciar Evaluación
            </button>
            <div id="error_carga" class="text-danger mt-3" style="display: none; font-size: 0.9rem; font-weight: 600;"></div>
        </div>
    </div>

    <div id="chat_pantalla">
        <div class="chat-header">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-light rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 42px; height: 42px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.5);" title="Volver al Portal">
                    <i class="bi bi-house-door-fill" style="color: var(--text-main);"></i>
                </a>
                <div style="background: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%); color: white; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(67, 24, 255, 0.3);">
                    <i class="bi bi-robot"></i>
                </div>
                <div>
                    <h5 class="mb-0 fw-bold" style="color: var(--text-main);">Tutor Evaluador</h5>
                    <div class="text-muted" style="font-size: 0.85rem;" id="estado_ia_badge"><i class="bi bi-circle-fill text-warning" style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i> Inicializando...</div>
                </div>
            </div>
            <div class="badge-tema" id="tema_actual_badge">
                <i class="bi bi-journal-medical me-1"></i> Tema
            </div>
        </div>

        <div class="chat-history" id="chat_history">
        </div>

        <div class="chat-input-area">
            <textarea id="user_input" class="chat-input" placeholder="Escribe tu respuesta aquí... (Presiona Enter para enviar)" rows="1" oninput="autoResize(this)"></textarea>
            <button id="btn_send" class="btn-send" onclick="enviarMensaje()">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // =======================================================================
        // 🔑 CONFIGURACIÓN DE GEMINI API (TUTOR UNIVERSAL)
        // =======================================================================
        
        let MODEL = "gemini-2.5-flash"; 
        
        // Pega tu llave de Google AI Studio aquí:
        const geminiP1 = "AQ.Ab8RN6JQAtMlVOg3cL2L"; 
        const geminiP2 = "kf6xOq5UQhTxII--Bba3yHFzfZKySQ"; 
        
        let apiKey = geminiP1.trim() + geminiP2.trim();
        let isSimulacion = false;

        const host = window.location.hostname;
        
        if (host.includes("googleusercontent.com") || host === "") {
            apiKey = ""; 
            MODEL = "gemini-2.5-flash-preview-09-2025";
        } else if (apiKey.length < 20 || apiKey.includes("AQUÍ_TU_MITAD")) {
            isSimulacion = true;
        }
        
        // =======================================================================
        
        let chatHistory = [];
        let systemPromptBase = "";
        
        // Se asegura que los eventos y variables del DOM solo se capturen tras cargar la página
        // para prevenir errores del tipo 'Cannot read properties of null'.
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('user_input');
            if (userInput) {
                userInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        enviarMensaje();
                    }
                });
            }

            const inputTemaId = document.getElementById('input_tema_id');
            if (inputTemaId) {
                inputTemaId.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        iniciarEvaluacion();
                    }
                });
            }
        });

        function verificarModoIa() {
            const estadoIaBadge = document.getElementById('estado_ia_badge');
            if (!estadoIaBadge) return;
            
            if (isSimulacion) {
                estadoIaBadge.innerHTML = '<i class="bi bi-circle-fill text-warning" style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i> Modo Simulación (MVP)';
            } else {
                estadoIaBadge.innerHTML = '<i class="bi bi-circle-fill text-success" style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i> IA Universal Optimizada';
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 120 ? textarea.scrollHeight : 120) + 'px';
        }

        async function iniciarEvaluacion() {
            const inputTemaId = document.getElementById('input_tema_id');
            const btnIniciar = document.getElementById('btn_iniciar');
            const errorCarga = document.getElementById('error_carga');
            const badgeTema = document.getElementById('tema_actual_badge');
            const selectorPantalla = document.getElementById('selector_pantalla');
            const chatPantalla = document.getElementById('chat_pantalla');

            const temaId = inputTemaId ? inputTemaId.value.trim() : "";
            if (!temaId) {
                mostrarError("Por favor escribe un ID de tema válido.");
                return;
            }

            if (btnIniciar) {
                btnIniciar.disabled = true;
                btnIniciar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Analizando documento...';
            }
            if (errorCarga) errorCarga.style.display = 'none';

            try {
                const urlJson = `./conocimiento_ia/conocimiento_${temaId}.json`;
                let contextoExtraido = "";

                try {
                    const response = await fetch(urlJson);
                    if (!response.ok) throw new Error("Archivo no encontrado en el servidor");
                    const data = await response.json();
                    
                    // 🛡️ DIETA DE TOKENS AJUSTADA PARA CURSOS SEGMENTADOS (50.000 caracteres)
                    // Permite leer unas 10 a 15 páginas de texto completo sin truncar.
                    let textoCompleto = data.contexto_base || "";
                    if (textoCompleto.length > 50000) {
                        contextoExtraido = textoCompleto.substring(0, 50000) + "... [Fin del extracto]";
                    } else {
                        contextoExtraido = textoCompleto;
                    }
                    
                } catch (fetchError) {
                    console.warn("Usando conocimiento de respaldo genérico.");
                    if (!isSimulacion) {
                        throw new Error(`El tema '${temaId}' no existe en la base de datos.`);
                    }
                    // Respaldo 100% genérico para el simulador
                    contextoExtraido = `
                        DOCUMENTO DE EJEMPLO GENÉRICO
                        Capítulo 1: Introducción a los Conceptos Básicos. Define los fundamentos teóricos de la materia.
                        Capítulo 2: Aplicación Práctica. Explica cómo llevar la teoría a escenarios reales usando herramientas estándar.
                        Capítulo 3: Evaluación y Seguimiento. Detalla los indicadores de éxito y cómo medir el impacto de las acciones tomadas.
                    `;
                }

                // 🧠 PROMPT UNIVERSAL, ADAPTATIVO Y PORCENTUAL
                systemPromptBase = `
                    Eres un Tutor y Evaluador Experto. Tu objetivo es evaluar el nivel de comprensión del estudiante sobre el documento cargado y generar una "Ruta de Aprendizaje" personalizada.
                    
                    DOCUMENTO BASE DE CONOCIMIENTO (RESUMIDO):
                    ${contextoExtraido}

                    REGLAS OBLIGATORIAS DE INTERACCIÓN (SÍGUELAS PASO A PASO):
                    PASO 1 (INICIO): Analiza el documento base y extrae mentalmente sus temas, capítulos o módulos principales. Preséntate cordialmente, enumera brevemente estos temas y pregúntale al estudiante SOBRE CUÁL de ellos desea ser evaluado hoy. NO hagas preguntas evaluativas todavía. Espera su respuesta.
                    PASO 2 (EVALUACIÓN): Una vez el estudiante elija su tema, formula UN (1) caso práctico o pregunta de análisis correspondiente a esa sección del documento. Hazle una sola pregunta a la vez.
                    PASO 3 (EVALUACIÓN FLEXIBLE Y PORCENTUAL): Espera la respuesta del estudiante. Analiza el sentido de su respuesta (no exijas palabras exactas, valora el análisis crítico). Califícalo con una ESCALA PORCENTUAL (Ej: "Tu respuesta es 80% acertada", "Tienes un 60% de precisión"). Explícale amablemente qué le faltó para llegar al 100% o felicítalo, y lanza la siguiente pregunta sobre un tema diferente del documento. Haz un máximo de 3 a 4 preguntas en total.
                    PASO 4 (VEREDICTO FINAL): Tras finalizar las preguntas, despídete. Dile explícitamente cuáles temas domina y en cuáles falló. Finalmente, recomiéndale ir a su plataforma de estudio y repasar EXCLUSIVAMENTE los capítulos o temas específicos en los que tuvo menor porcentaje.
                `;

                verificarModoIa();
                if (badgeTema) badgeTema.innerHTML = `<i class="bi bi-tag-fill me-1"></i> ${temaId.toUpperCase().replace(/_/g, ' ')}`;
                if (selectorPantalla) selectorPantalla.style.display = 'none';
                if (chatPantalla) chatPantalla.style.display = 'flex';

                arrancarConversacion();

            } catch (error) {
                mostrarError(`<i class="bi bi-exclamation-triangle-fill me-1"></i> Error: ${error.message}. Verifica que el archivo JSON esté subido.`);
                if (btnIniciar) {
                    btnIniciar.disabled = false;
                    btnIniciar.innerHTML = '<i class="bi bi-play-fill me-1"></i> Iniciar Evaluación';
                }
            }
        }

        function mostrarError(msg) {
            const errorCarga = document.getElementById('error_carga');
            if (errorCarga) {
                errorCarga.innerHTML = msg;
                errorCarga.style.display = 'block';
            }
        }

        async function arrancarConversacion() {
            mostrarTyping();
            try {
                // Gatillo oculto GENÉRICO
                const promptOculto = "Hola, soy el estudiante. Por favor preséntate, indícame de forma resumida qué temas o capítulos principales detectaste en el documento cargado y pregúntame sobre cuál de ellos deseo ser evaluado hoy.";
                const respuesta = await procesarGeminiAPI(promptOculto, true);
                quitarTyping();
                agregarMensaje(respuesta, 'bot');
            } catch (error) {
                quitarTyping();
                agregarMensaje(`❌ <strong>Aviso del Sistema:</strong> ${error.message}`, 'bot');
            }
        }

        async function enviarMensaje() {
            const userInput = document.getElementById('user_input');
            const btnSend = document.getElementById('btn_send');
            
            if (!userInput) return;
            const texto = userInput.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.focus();
            
            if (btnSend) btnSend.disabled = true;
            mostrarTyping();

            try {
                const respuesta = await procesarGeminiAPI(texto, false);
                quitarTyping();
                agregarMensaje(respuesta, 'bot');
            } catch (error) {
                quitarTyping();
                agregarMensaje(`⚠️ <strong>Aviso del Sistema:</strong> ${error.message}`, 'bot');
            } finally {
                if (btnSend) btnSend.disabled = false;
            }
        }

        function agregarMensaje(texto, remitente) {
            const chatHistoryDiv = document.getElementById('chat_history');
            if (!chatHistoryDiv) return;

            const div = document.createElement('div');
            div.classList.add('msg', `msg-${remitente}`);
            
            let textoFormateado = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            textoFormateado = textoFormateado.replace(/\n/g, '<br>');
            
            div.innerHTML = textoFormateado;
            chatHistoryDiv.appendChild(div);
            
            chatHistoryDiv.scrollTo({ top: chatHistoryDiv.scrollHeight, behavior: 'smooth' });
        }

        function mostrarTyping() {
            const chatHistoryDiv = document.getElementById('chat_history');
            if (!chatHistoryDiv) return;

            const div = document.createElement('div');
            div.classList.add('msg', 'msg-bot');
            div.id = 'typing_indicator';
            div.innerHTML = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            chatHistoryDiv.appendChild(div);
            chatHistoryDiv.scrollTo({ top: chatHistoryDiv.scrollHeight, behavior: 'smooth' });
        }

        function quitarTyping() {
            const indicator = document.getElementById('typing_indicator');
            if (indicator) indicator.remove();
        }

        async function procesarGeminiAPI(mensajeUsuario, esPrimerMensaje = false) {
            if (isSimulacion) {
                await new Promise(res => setTimeout(res, 1500)); 
                if (esPrimerMensaje) {
                    return "¡Hola! Soy tu Tutor IA 🏥. Te hablo desde el **Modo Simulación**.\n\nHe analizado el documento cargado y veo que trata sobre 3 capítulos principales: Introducción, Aplicación Práctica y Evaluación. **¿Sobre cuál de estos temas deseas que te evalúe hoy?**";
                } else {
                    return "*(Respuesta simulada)*. Tu análisis tiene un **75% de precisión**. Captaste la idea principal de forma excelente, pero olvidaste mencionar un detalle clave del protocolo.\n\nSiguiente caso: Si te encuentras en la fase de Evaluación, ¿qué indicadores analizarías primero?";
                }
            }

            if (!esPrimerMensaje) {
                chatHistory.push({ role: "user", parts: [{ text: mensajeUsuario }] });
            }

            const payload = {
                contents: chatHistory.length > 0 ? chatHistory : [{ role: "user", parts: [{ text: mensajeUsuario }] }],
                systemInstruction: { parts: [{ text: systemPromptBase }] }
            };

            const maxRetries = 2;
            const delays = [1000, 2500];

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            throw new Error("El Tutor IA está analizando la información. Por favor, <strong>espera 20 segundos</strong> y vuelve a intentar.");
                        }

                        let errorMsg = `Error HTTP ${response.status}`;
                        try {
                            const errorData = await response.json();
                            errorMsg += ` - ${errorData.error.message}`;
                        } catch(e) {}
                        throw new Error(errorMsg);
                    }
                    
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No pude generar una respuesta válida.";
                    
                    if(esPrimerMensaje) {
                        chatHistory = [
                            { role: "user", parts: [{ text: "Hola, soy el estudiante. Por favor preséntate, indícame qué temas detectaste en el documento y pregúntame por dónde iniciar." }] },
                            { role: "model", parts: [{ text: aiText }] }
                        ];
                    } else {
                        chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    }
                    
                    return aiText;
                    
                } catch (error) {
                    if (attempt === maxRetries || error.message.includes("espera 20 segundos")) {
                        throw error;
                    }
                    await new Promise(res => setTimeout(res, delays[attempt]));
                }
            }
        }
    </script>
</body>
