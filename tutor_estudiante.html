<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA - Secretaría de Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* PALETA LIQUID GLASS */
        :root[data-theme="light"] {
            --bg-color: #f4f7fe;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4318ff;
            --success: #05cd99;
            --danger: #ee5d50;
            --border-light: rgba(255, 255, 255, 0.8);
            --border-color: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);

            --chat-user-bg: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%);
            --chat-user-text: #ffffff;
            --chat-bot-bg: rgba(255, 255, 255, 0.9);
            --chat-bot-text: #1e293b;
            --chat-bot-border: rgba(67, 24, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* Burbujas flotantes de fondo optimizadas */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 15s infinite alternate ease-in-out;
            will-change: transform;
            transform: translateZ(0);
            pointer-events: none;
        }

        body::before {
            width: 45vw;
            height: 45vw;
            background: rgba(67, 24, 255, 0.15);
            top: -10%;
            left: -10%;
        }

        body::after {
            width: 35vw;
            height: 35vw;
            background: rgba(5, 205, 153, 0.15);
            bottom: -10%;
            right: -5%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            100% {
                transform: translate3d(6vw, 6vh, 0) scale(1.1);
            }
        }

        /* --- PANTALLA DE SELECCIÓN DE TEMA --- */
        #selector_pantalla {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(244, 247, 254, 0.5);
        }

        .selector-card {
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--border-light);
            border-left: 1px solid var(--border-light);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .icon-robot {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(67, 24, 255, 0.3));
        }

        .form-select-custom {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.05rem;
            color: var(--text-main);
            width: 100%;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            outline: none;
            transition: all 0.3s;
        }

        .form-select-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.15);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(67, 24, 255, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(67, 24, 255, 0.4);
            color: white;
        }

        /* --- INTERFAZ DEL CHAT --- */
        #chat_pantalla {
            display: none;
            flex-direction: column;
            height: 100vh;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }

        .chat-header {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .badge-tema {
            background: rgba(67, 24, 255, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(67, 24, 255, 0.2);
        }

        .chat-history {
            flex-grow: 1;
            background: transparent;
            overflow-y: auto;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Ocultar barra de scroll para que se vea limpio */
        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        /* Burbujas de Chat */
        .msg {
            max-width: 80%;
            padding: 18px 24px;
            border-radius: 24px;
            font-size: 1.05rem;
            line-height: 1.6;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-bot {
            align-self: flex-start;
            background: var(--chat-bot-bg);
            color: var(--chat-bot-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--chat-bot-border);
        }

        .msg-bot strong {
            color: var(--primary);
        }

        .msg-user {
            align-self: flex-end;
            background: var(--chat-user-bg);
            color: var(--chat-user-text);
            border-bottom-right-radius: 4px;
        }

        /* Área de input */
        .chat-input-area {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 15px;
            display: flex;
            gap: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            margin-top: 20px;
            flex-shrink: 0;
            align-items: center;
        }

        .chat-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 10px 15px;
            font-size: 1.05rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 45px;
            font-family: 'Inter', sans-serif;
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            transform: scale(1.05);
            background: #3210cc;
        }

        .btn-send:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        /* Animación "Escribiendo..." */
        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            opacity: 0.7;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- ========================================== -->
    <!-- PANTALLA 1: SELECCIÓN DE TEMA              -->
    <!-- ========================================== -->
    <div id="selector_pantalla">
        <div class="selector-card">
            <div class="icon-robot"><i class="bi bi-robot"></i></div>
            <h2 class="fw-bold mb-2">Evaluador Clínico IA</h2>
            <p class="text-muted mb-4">Selecciona el módulo normativo sobre el cual deseas ser evaluado para generar tu
                ruta de aprendizaje.</p>

            <select id="select_tema" class="form-select-custom">
                <option value="" disabled selected>Selecciona un tema...</option>
                <option value="res_3280_pym">Resolución 3280 - Ruta de Promoción y Mantenimiento</option>
                <!-- Puedes agregar más temas aquí manualmente o dejarlos que el usuario los escriba en el input de abajo -->
            </select>

            <div class="mb-4">
                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 5px;">¿Tienes un ID de curso específico?
                </p>
                <input type="text" id="input_tema_id" class="form-select-custom py-2" placeholder="Ej: res_3280_pym"
                    style="font-size: 0.95rem; margin-bottom: 0;">
            </div>

            <button class="btn-start" id="btn_iniciar" onclick="iniciarEvaluacion()">
                <i class="bi bi-play-fill me-1"></i> Iniciar Evaluación
            </button>
            <div id="error_carga" class="text-danger mt-3" style="display: none; font-size: 0.9rem; font-weight: 600;">
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA 2: INTERFAZ DEL CHAT              -->
    <!-- ========================================== -->
    <div id="chat_pantalla">
        <div class="chat-header">
            <div class="d-flex align-items-center gap-3">
                <div
                    style="background: linear-gradient(135deg, var(--primary) 0%, #7551ff 100%); color: white; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(67, 24, 255, 0.3);">
                    <i class="bi bi-robot"></i>
                </div>
                <div>
                    <h5 class="mb-0 fw-bold" style="color: var(--text-main);">Tutor Evaluador</h5>
                    <div class="text-muted" style="font-size: 0.85rem;"><i class="bi bi-circle-fill text-success"
                            style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i> En línea</div>
                </div>
            </div>
            <div class="badge-tema" id="tema_actual_badge">
                <i class="bi bi-journal-medical me-1"></i> Tema
            </div>
        </div>

        <div class="chat-history" id="chat_history">
            <!-- Los mensajes irán apareciendo aquí -->
        </div>

        <div class="chat-input-area">
            <textarea id="user_input" class="chat-input"
                placeholder="Escribe tu respuesta aquí... (Presiona Enter para enviar)" rows="1"
                oninput="autoResize(this)"></textarea>
            <button id="btn_send" class="btn-send" onclick="enviarMensaje()">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE GEMINI API
        // ==========================================
        // El entorno Canvas proveerá esta variable automáticamente al ejecutar.
        const apiKey = "";
        const MODEL = "gemini-2.5-flash-preview-09-2025";

        let chatHistory = [];
        let systemPromptBase = "";

        // Elementos del DOM
        const selectorPantalla = document.getElementById('selector_pantalla');
        const chatPantalla = document.getElementById('chat_pantalla');
        const selectTema = document.getElementById('select_tema');
        const inputTemaId = document.getElementById('input_tema_id');
        const btnIniciar = document.getElementById('btn_iniciar');
        const errorCarga = document.getElementById('error_carga');

        const chatHistoryDiv = document.getElementById('chat_history');
        const userInput = document.getElementById('user_input');
        const btnSend = document.getElementById('btn_send');
        const badgeTema = document.getElementById('tema_actual_badge');

        // Sincronizar select e input para facilidad de uso
        selectTema.addEventListener('change', (e) => {
            inputTemaId.value = e.target.value;
        });

        // Auto-ajustar altura del textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 120 ? textarea.scrollHeight : 120) + 'px';
        }

        // ==========================================
        // 1. CARGA DE CONOCIMIENTO (RAG)
        // ==========================================
        async function iniciarEvaluacion() {
            const temaId = inputTemaId.value.trim();
            if (!temaId) {
                mostrarError("Por favor selecciona o escribe un ID de tema válido.");
                return;
            }

            btnIniciar.disabled = true;
            btnIniciar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Cargando conocimiento...';
            errorCarga.style.display = 'none';

            try {
                // AQUÍ OCURRE LA MAGIA: Intentamos leer el archivo .json que subiste a GitHub
                // Asumimos que la carpeta "conocimiento_ia" está en la raíz de tu repositorio
                const urlJson = `./conocimiento_ia/conocimiento_${temaId}.json`;

                let contextoExtraido = "";

                try {
                    const response = await fetch(urlJson);
                    if (!response.ok) throw new Error("Archivo no encontrado en el servidor");
                    const data = await response.json();
                    contextoExtraido = data.contexto_base;
                    console.log("Conocimiento cargado exitosamente del archivo JSON.");
                } catch (fetchError) {
                    console.warn("No se pudo cargar el JSON desde el servidor. Usando conocimiento de respaldo (Mockup) para el MVP.");
                    // Fallback para que el MVP funcione incluso si no has subido la carpeta a GitHub aún
                    if (temaId === "res_3280_pym") {
                        contextoExtraido = `
                            RESOLUCIÓN 3280 DE 2018 - RUTA DE PROMOCIÓN Y MANTENIMIENTO DE LA SALUD.
                            CURSOS DE VIDA:
                            1. Primera Infancia (0 - 5 años): Se aplica escala abreviada de desarrollo, tamizaje visual y auditivo, esquema de vacunación, valoración nutricional.
                            2. Infancia (6 - 11 años): Valoración de crecimiento, tamizaje agudeza visual, educación en higiene oral, valoración familiar.
                            3. Adolescencia (12 - 17 años): Asesoría en salud sexual y reproductiva (anticoncepción), prevención de consumo de sustancias, tamizaje de hemoglobina.
                            4. Juventud (18 - 28 años): Valoración de riesgo cardiovascular, tamizaje de citología/VPH (mujeres), asesoría para el proyecto de vida.
                            5. Adultez (29 - 59 años): Tamizaje de cáncer de mama, cuello uterino, próstata y colon. Perfil lipídico y glicemia. 
                            6. Vejez (60 años y más): Escalas de valoración geriátrica integral (Barthel, Lawton), despistaje de deterioro cognitivo (Mini-Mental), prevención de caídas.
                        `;
                    } else {
                        throw new Error(`El tema '${temaId}' no existe en la base de datos.`);
                    }
                }

                // ARMAMOS LA PERSONALIDAD DE LA IA
                systemPromptBase = `
                    Eres un Evaluador Clínico Experto y Estricto de la Secretaría de Salud.
                    Tu objetivo es evaluar al estudiante para definir su "Ruta de Aprendizaje".
                    
                    REGLAS OBLIGATORIAS:
                    1. INICIO: Preséntate y dile que le harás preguntas prácticas sobre el documento normativo.
                    2. FLUJO: Haz SOLO UNA (1) pregunta a la vez. Espera la respuesta del estudiante. NUNCA hagas múltiples preguntas de golpe.
                    3. PREGUNTAS: Formula casos clínicos cortos basados EXCLUSIVAMENTE en el "Contexto Base". (Ej: "Te llega a consulta un paciente de X años, según la norma, ¿qué tamizajes son obligatorios?").
                    4. EVALUACIÓN: Cuando el estudiante responda, dile claramente si es CORRECTO o INCORRECTO basándote en la norma, retroalimenta brevemente, y lanza la siguiente pregunta.
                    5. VEREDICTO FINAL: Tras hacer unas 3 o 4 preguntas en total, finaliza la conversación. Dile explícitamente qué temas domina y cuáles falló. Recomienda una "Ruta de Aprendizaje" indicando que solo debe tomar los módulos donde falló.
                    
                    DOCUMENTO NORMATIVO (CONTEXTO BASE):
                    ${contextoExtraido}
                `;

                // Preparar UI
                badgeTema.innerHTML = `<i class="bi bi-tag-fill me-1"></i> ${temaId.toUpperCase().replace(/_/g, ' ')}`;
                selectorPantalla.style.display = 'none';
                chatPantalla.style.display = 'flex';

                // Iniciar la charla
                arrancarConversacion();

            } catch (error) {
                mostrarError(`<i class="bi bi-exclamation-triangle-fill me-1"></i> Error: ${error.message}. Verifica que el archivo JSON esté en la carpeta 'conocimiento_ia/'.`);
                btnIniciar.disabled = false;
                btnIniciar.innerHTML = '<i class="bi bi-play-fill me-1"></i> Iniciar Evaluación';
            }
        }

        function mostrarError(msg) {
            errorCarga.innerHTML = msg;
            errorCarga.style.display = 'block';
        }

        // ==========================================
        // 2. LÓGICA DEL CHAT
        // ==========================================

        // Enviar con tecla "Enter" (sin Shift)
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensaje();
            }
        });

        async function arrancarConversacion() {
            mostrarTyping();
            try {
                // Un "empujón" oculto para que la IA dé el primer paso y salude
                const promptOculto = "Hola, soy el estudiante. Por favor preséntate y hazme la primera pregunta clínica para iniciar mi evaluación.";
                const respuesta = await procesarGeminiAPI(promptOculto, true);
                quitarTyping();
                agregarMensaje(respuesta, 'bot');
            } catch (error) {
                quitarTyping();
                agregarMensaje("❌ Error de conexión con el servidor de la IA. Por favor, recarga la página.", 'bot');
            }
        }

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            userInput.value = '';
            userInput.style.height = 'auto'; // Resetear altura
            userInput.focus();

            btnSend.disabled = true;
            mostrarTyping();

            try {
                const respuesta = await procesarGeminiAPI(texto, false);
                quitarTyping();
                agregarMensaje(respuesta, 'bot');
            } catch (error) {
                quitarTyping();
                agregarMensaje("⚠️ Tuvimos un problema procesando tu respuesta. Por favor, intenta enviarla de nuevo.", 'bot');
                console.error(error);
            } finally {
                btnSend.disabled = false;
            }
        }

        function agregarMensaje(texto, remitente) {
            const div = document.createElement('div');
            div.classList.add('msg', `msg-${remitente}`);

            // Formatear texto (Negritas y saltos de línea)
            let textoFormateado = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            textoFormateado = textoFormateado.replace(/\n/g, '<br>');

            div.innerHTML = textoFormateado;
            chatHistoryDiv.appendChild(div);

            // Hacer scroll suave hacia abajo
            chatHistoryDiv.scrollTo({
                top: chatHistoryDiv.scrollHeight,
                behavior: 'smooth'
            });
        }

        function mostrarTyping() {
            const div = document.createElement('div');
            div.classList.add('msg', 'msg-bot');
            div.id = 'typing_indicator';
            div.innerHTML = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            chatHistoryDiv.appendChild(div);
            chatHistoryDiv.scrollTo({ top: chatHistoryDiv.scrollHeight, behavior: 'smooth' });
        }

        function quitarTyping() {
            const indicator = document.getElementById('typing_indicator');
            if (indicator) indicator.remove();
        }

        // ==========================================
        // 3. CONEXIÓN A GOOGLE GEMINI API
        // ==========================================
        async function procesarGeminiAPI(mensajeUsuario, esPrimerMensaje = false) {
            // No guardamos en el historial el "empujón" inicial para que no ensucie el contexto
            if (!esPrimerMensaje) {
                chatHistory.push({ role: "user", parts: [{ text: mensajeUsuario }] });
            }

            const payload = {
                contents: chatHistory.length > 0 ? chatHistory : [{ role: "user", parts: [{ text: mensajeUsuario }] }],
                systemInstruction: { parts: [{ text: systemPromptBase }] }
            };

            // Implementación de reintentos (Backoff exponencial) recomendada para APIs
            const maxRetries = 3;
            const delays = [1000, 2500, 5000];

            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Lo siento, no pude formular una respuesta.";

                    // Guardar la respuesta de la IA en la memoria de la conversación
                    if (esPrimerMensaje) {
                        // Si es el primer mensaje, inicializamos el historial formalmente
                        chatHistory = [
                            { role: "user", parts: [{ text: "Inicia la evaluación." }] },
                            { role: "model", parts: [{ text: aiText }] }
                        ];
                    } else {
                        chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    }

                    return aiText;

                } catch (error) {
                    if (attempt === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[attempt]));
                }
            }
        }
    </script>
</body>

</html>
