name: Automatizacion Scraping y Dashboard

on:
  schedule:
    # Corre a las 3:17 AM hora Colombia (8:17 AM UTC) para evitar filas en los servidores
    - cron: '17 8 * * *'
  workflow_dispatch: # Botón manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 CRÍTICO: Le da permiso al robot para modificar archivos del repositorio
    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4
      with:
        ref: main # 👈 Asegura que se pare en la rama principal y no en una temporal

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests google-auth google-auth-oauthlib google-api-python-client
        
    - name: Reconstruir Credenciales de Google desde los Secrets
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        echo '${{ secrets.GOOGLE_TOKEN }}' > token.json

    - name: Ejecutar Extractor y Procesamiento
      run: |
        python scraper_forms.py
        python procesamiento_json.py

    - name: Autoguardar Cambios en GitHub
      run: |
        git config --global user.name 'Automated Scraper'
        git config --global user.email 'actions@github.com'
        git add .
        # Cambia a main explícitamente y asegura que no falle si no hay cambios
        git checkout main
        git diff-index --quiet HEAD || (git commit -m "Bot: Datos actualizados automáticamente" && git push origin main)
